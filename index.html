  :root { --wood:#2b1d12; --wood2:#3d2a1a; --dark:#120b06; --cream:#f4e9c8; --gold:#ffd84a; }
  * { -webkit-tap-highlight-color: transparent; }
  html,body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas:focus, button:focus { outline:none; }
  ::selection { background:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b2a1a; color:var(--cream);
    font-family:"Press Start 2P", ui-monospace, monospace; }
  #wrap { position:fixed; inset:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display:flex; flex-direction:column; }
  #bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 10px; background:var(--wood);
    border-bottom:4px solid var(--dark); font-size:10px; }
  .stat { display:flex; align-items:center; gap:6px; background:var(--wood2); padding:7px 8px; border:2px solid var(--dark);
    box-shadow:inset -2px -2px 0 #24170d, inset 2px 2px 0 #5a4028; white-space:nowrap; }
  .coin { width:10px; height:10px; background:var(--gold); box-shadow:inset -2px -2px 0 #c99a1a, inset 2px 2px 0 #fff2a8; outline:2px solid #6b4a0a; }
  button { font-family:inherit; font-size:9px; color:var(--wood); background:var(--gold); border:2px solid var(--dark);
    padding:7px 9px; cursor:pointer; box-shadow:inset -2px -2px 0 #c99a1a, inset 2px 2px 0 #fff2a8; }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { background:#7d6f55; color:#3d3222; box-shadow:inset -2px -2px 0 #5d523f; cursor:default; }
  button.danger { background:#d8584a; color:#fff2e8; box-shadow:inset -2px -2px 0 #9a3428, inset 2px 2px 0 #f0948a; }
  button.alt { background:#8fc06a; box-shadow:inset -2px -2px 0 #5e8a42, inset 2px 2px 0 #c7eaa5; }
  .spacer { flex:1; }
  .zoom { padding:3px 4px; gap:6px; }
  button.z { padding:4px 7px; font-size:10px; }
  .hint { font-size:8px; color:#bfae86; line-height:1.6; }
  #stage { background:#1b2a1a; flex:1; position:relative; display:grid; place-items:center; overflow:hidden; min-height:0; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; touch-action:none; }
  .clockwrap { position:relative; display:inline-block; }
  #clockMenu { display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:20; background:var(--wood); border:3px solid var(--dark);
    box-shadow:inset -2px -2px 0 #24170d, inset 2px 2px 0 #5a4028, 0 6px 16px rgba(0,0,0,.5); padding:6px; width:150px; }
  #clockMenu.open { display:block; }
  #clockMenu button { display:block; width:100%; margin:0 0 5px; text-align:left; background:var(--wood2); color:var(--cream); box-shadow:inset -2px -2px 0 #24170d, inset 2px 2px 0 #5a4028; }
  #clockMenu button.now { outline:2px dashed #ffd84a; outline-offset:-4px; }
  #clockMenu button.locked { background:#ffd84a; color:var(--wood); box-shadow:inset -2px -2px 0 #c99a1a, inset 2px 2px 0 #fff2a8; }
  .cm-hint { font-size:7px; color:#bfae86; line-height:1.6; margin-top:2px; }

  }

<body>
<div id="wrap">

  </div>
  <div id="stage"><canvas id="c"></canvas><div id="toast"></div></div>
</div>

<script>
// ================== настройки ==================
const TW = 512, TH = 384;             // весь мир в «пикселях», вместе с закрытыми участками по краям
const CH = 64;                         // размер одного участка-квадрата
const FIELD = { x: 64, y: 64, w: 384, h: 256 }; // стартовое игровое поле
const LOCKED = "#1b2a1a";              // цвет закрытых участков (как прежняя зелёная рамка)
const HIRE_BASE = 10, HIRE_STEP = 1;     // каждый следующий дровосек дороже на 1
const REGROW_STUMP = 40, REGROW_SAPLING = 20; // в сумме 60 сек. реального времени
const CARRY = 2;                       // сколько кусков дерева несёт за раз
const LOGS_PER_TREE = 2;
const FLOOR_COST = 40, MAX_FLOORS = Infinity, BEDS_PER_FLOOR = 8, FLOOR_H = 10, VIS_FLOORS = 9;
const WALK = 20;                       // пикс/сек
const SWING = 0.8;                     // сек на один удар (обычный топор)
// инструменты: каждый следующий уровень рубит быстрее
const TOOLS = [
  { name: "Топор", swing: .80 },
  { name: "Острый топор", swing: .66 },
  { name: "Стальной топор", swing: .55 },
  { name: "Двойной топор", swing: .45 },
  { name: "Пила", swing: .36 },
  { name: "Циркулярная пила", swing: .27 },
];
const TOOL_MAX = TOOLS.length - 1, TOOL_COST = 5;
const swingOf = m => TOOLS[m.tool || 0].swing;
const HOUSE = { x: 240, y: 170, w: 32, h: 26 };
const DOOR = { x: HOUSE.x + 16, y: HOUSE.y + HOUSE.h + 3 };

// ================== палитра и спрайты ==================
const PAL = {
  "1":"#1f4a2a","2":"#2e6b3b","3":"#46904c","4":"#6cb85e",
  "t":"#6b4426","T":"#4a2d18","c":"#e0b77c","C":"#b88a52",
  "h":"#a33a2a","H":"#7a2a1e","k":"#f0c08a","B":"#7a4a28",
  "r":"#c8402e","R":"#8e2a20","P":"#2c3a6a","p":"#3d4f8f","b":"#3a2414",
};
function spr(rows, over = {}) {
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  rows.forEach((r, y) => { for (let x = 0; x < w; x++) { const ch = r[x]; if (ch === ".") continue;
    g.fillStyle = over[ch] || PAL[ch]; g.fillRect(x, y, 1, 1); } });
  return cv;
}
const OAK = ["...111111...",".1122332211.","122233442221","122334432221","122233322321","122222223321",
             "122322222221",".1223322221.","..11122111..",".....tT.....",".....tT.....",".....tT....."];
const PINE = [".....1.....","....121....","....131....","...12221...","...12321...","..1222221..","..1223221..",
              ".122222321.",".122232221.","12222222321","12232222221",".111222111.","....tTt....","....tTt...."];
const S = {
  oak: spr(OAK),
  oak2: spr(OAK, {"1":"#2a4f22","2":"#3f7a2e","3":"#5f9c3c","4":"#8cc45a"}),
  pine: spr(PINE, {"1":"#163a24","2":"#235a35","3":"#33784a","4":"#4c9a5e"}),
  stump: spr([".ttttt.","tcCcCct","tcccccT","tTttTTT",".TTTTT."]),
  sapling: spr(["..3..",".343.","3.3.3","..3..","..t.."]),
  log: spr(["ctttttT","CtTtttT","cttTttT"]),
};
const MAN_TOP = ["..hhh..",".hhhhh.",".HHHHH.","..kkk..","..BkB..",".rRrRr.","krRrRrk","..PPP.."];
const LEGS_A = ["..p.p..","..b.b.."], LEGS_B = [".p...p.",".b...b."];
const HATS = [["#a33a2a","#7a2a1e"],["#2f7a3a","#1f5228"],["#2f5aa3","#203f74"],["#d8a020","#9a7010"],["#7a3aa3","#562874"]];
const ELDER_TOP = ["..ggg..",".ggggg.",".gkkkg.","..kkk..","..www..",".nwwwn.","knwwwnk","..nnn.."];
const ELDER_PAL = { g:"#d9d9d9", w:"#f2f2f2", n:"#5d6b8a", p:"#4a4f63", b:"#3a2414" };
const ELDER_SPR = [spr(ELDER_TOP.concat(LEGS_A), ELDER_PAL), spr(ELDER_TOP.concat(LEGS_B), ELDER_PAL)];
const MEN_SPR = HATS.map(([h, H]) => [spr(MAN_TOP.concat(LEGS_A), {h, H}), spr(MAN_TOP.concat(LEGS_B), {h, H})]);
const MAN_BACK = ["..hhh..",".hhhhh.",".HHHHH.","..BBB..","..kkk..",".rRrRr.","krRrRrk","..PPP.."];
const MEN_BACK = HATS.map(([h, H]) => [spr(MAN_BACK.concat(LEGS_A), {h, H}), spr(MAN_BACK.concat(LEGS_B), {h, H})]);
const ELDER_BACK_TOP = ["..ggg..",".ggggg.",".ggggg.","..ggg..","..kkk..",".nnnnn.","knnnnnk","..nnn.."];
const ELDER_BACK = [spr(ELDER_BACK_TOP.concat(LEGS_A), ELDER_PAL), spr(ELDER_BACK_TOP.concat(LEGS_B), ELDER_PAL)];

// ================== земля (рисуется один раз) ==================
const ground = document.createElement("canvas"); ground.width = TW; ground.height = TH;
function paintGrass(x0, y0, w, h) {
  const g = ground.getContext("2d");
  g.fillStyle = "#4c943c"; g.fillRect(x0, y0, w, h);
  const greens = ["#45893a", "#58a446", "#3f8035", "#5fae4c"], n = Math.round(w * h * .053);
  for (let i = 0; i < n; i++) { g.fillStyle = greens[i % 4]; g.fillRect(x0 + Math.random() * w | 0, y0 + Math.random() * h | 0, 1, 1 + (Math.random() < .3)); }
  const fl = ["#ffffff", "#ffe066", "#ff8fb0", "#9fd8ff"], cx = HOUSE.x + 16, cy = HOUSE.y + 22;
  for (let i = 0; i < Math.round(w * h * .0022); i++) { const x = x0 + Math.random() * w | 0, y = y0 + Math.random() * h | 0;
    if (((x - cx) / 44) ** 2 + ((y - cy) / 34) ** 2 < 1) continue; g.fillStyle = fl[i % 4]; g.fillRect(x, y, 1, 1); }
}
(function makeGround() {
  const g = ground.getContext("2d");
  g.fillStyle = LOCKED; g.fillRect(0, 0, TW, TH);
  paintGrass(FIELD.x, FIELD.y, FIELD.w, FIELD.h);
  // поляна вокруг домика
  const cx = HOUSE.x + 16, cy = HOUSE.y + 22;
  for (let y = FIELD.y; y < FIELD.y + FIELD.h; y++) for (let x = FIELD.x; x < FIELD.x + FIELD.w; x++) {
    const d = ((x - cx) / 40) ** 2 + ((y - cy) / 30) ** 2;
    if (d < 1 - Math.random() * 0.12) { g.fillStyle = Math.random() < .12 ? "#8e6a3e" : (Math.random() < .5 ? "#a47c4a" : "#9a7444"); g.fillRect(x, y, 1, 1); }
  }
  // тропинка к двери
  for (let y = DOOR.y - 2; y < DOOR.y + 14; y++) { g.fillStyle = "#8e6a3e"; g.fillRect(DOOR.x - 3, y, 6, 1); }
})();

// ================== мир ==================
let coins = 0, delivered = 0, felled = 0, speed = 1, hired = 0, elder = null, autoOn = true, drag = null;
let night = false, nightLvl = 0, floors = 0;
// старик сам решает: если больше двух дровосеков спят на полу — копит на новый этаж
const elderWantsFloor = () => floors < MAX_FLOORS && men.length - floors * BEDS_PER_FLOOR >= 3;
// снаружи видно до 9 надстроенных этажей (дальше дом упёрся бы в край карты) — остальное показывает флажок с числом этажей
const visFloors = () => Math.min(floors, VIS_FLOORS);
const houseUp = () => visFloors() * FLOOR_H;
const hidden = m => m.state === "inside" || m.state === "asleep" || m.state === "waking" || m.state === "inMine" || m.state === "hiding";
let mine = null, stone = 0, stoneHouse = false;
const MINE_AT = 100, STONE_FOR_HOUSE = 20;
const hireCost = () => HIRE_BASE + HIRE_STEP * hired;
const realNow = () => performance.now() / 1000;
const trees = [], logs = [], men = [], parts = [], floats = [];
function plantForest(x0, y0, w, h, grow) {
  const out = [];
  for (let row = 1; row <= h / 8; row++) for (let col = 0; col < w / 8; col++) {
    const x = x0 + col * 8 + 4 + ((Math.random() * 5) | 0) - 2, y = y0 + row * 8 + ((Math.random() * 5) | 0) - 2;
    const d = ((x - (HOUSE.x + 16)) / 48) ** 2 + ((y - (HOUSE.y + 22)) / 36) ** 2;
    if (d < 1 || Math.random() < .14) continue;
    const r = Math.random(), t = newTree(x, y, r < .45 ? "pine" : (r < .75 ? "oak" : "oak2"));
    if (grow) { t.state = "sapling"; t.regrowAt = realNow() + .6 + Math.random() * 3.5; }
    trees.push(t); out.push(t);
  }
  return out;
}
plantForest(FIELD.x, FIELD.y, FIELD.w, FIELD.h, false);

// ================== открытие новых участков ==================
const CCOLS = TW / CH, CROWS = TH / CH;
const unlocked = new Set();          // открытые участки за пределами стартового поля: "cx,cy"
const reveals = [];                  // анимации открытия
const inField = (x, y) => x >= FIELD.x && x < FIELD.x + FIELD.w && y >= FIELD.y && y < FIELD.y + FIELD.h;
const cellOpen = (cx, cy) => cx >= 0 && cy >= 0 && cx < CCOLS && cy < CROWS &&
  (inField(cx * CH + 1, cy * CH + 1) || unlocked.has(cx + "," + cy));
const isPlayable = (x, y) => cellOpen(Math.floor(x / CH), Math.floor(y / CH));
function clampPlayable(x, y) {
  if (isPlayable(x, y)) return { x, y };
  let best = null, bd = 1e9;
  for (let cy = 0; cy < CROWS; cy++) for (let cx = 0; cx < CCOLS; cx++) {
    if (!cellOpen(cx, cy)) continue;
    const px = Math.max(cx * CH + 3, Math.min(cx * CH + CH - 3, x)), py = Math.max(cy * CH + 12, Math.min(cy * CH + CH - 2, y)), d = Math.hypot(px - x, py - y);
    if (d < bd) { bd = d; best = { x: px, y: py }; }
  }
  return best || { x, y };
}
const level = () => unlocked.size + 1;
const needMen = () => 20 + 10 * (level() - 1);
const ZONE_COST = 10;
const lockedLeft = () => { let n = 0; for (let cy = 0; cy < CROWS; cy++) for (let cx = 0; cx < CCOLS; cx++) if (!cellOpen(cx, cy)) n++; return n; };
function checkUnlock() {
  if (!lockedLeft() || men.length < needMen() || coins < ZONE_COST) return;
  // случайный закрытый квадрат, который граничит с уже открытой землёй
  const cand = [];
  for (let cy = 0; cy < CROWS; cy++) for (let cx = 0; cx < CCOLS; cx++)
    if (!cellOpen(cx, cy) && (cellOpen(cx - 1, cy) || cellOpen(cx + 1, cy) || cellOpen(cx, cy - 1) || cellOpen(cx, cy + 1))) cand.push([cx, cy]);
  if (!cand.length) return;
  const [cx, cy] = cand[Math.random() * cand.length | 0], x0 = cx * CH, y0 = cy * CH;
  unlocked.add(cx + "," + cy); coins -= ZONE_COST;
  paintGrass(x0, y0, CH, CH);
  plantForest(x0, y0 - 8, CH, CH, true).forEach(t => { if (t.y < y0 + 6 || t.y > y0 + CH - 1) { t.state = "gone"; } });
  for (let i = trees.length - 1; i >= 0; i--) if (trees[i].state === "gone") trees.splice(i, 1);
  for (let i = 0; i < 10; i++) fireflies.push({ x: x0 + Math.random() * CH, y: y0 + Math.random() * CH, ph: Math.random() * 6.28, sp: .6 + Math.random() * .8 });
  reveals.push({ x0, y0, t: 0 });
  for (let i = 0; i < 60; i++) parts.push({ x: x0 + Math.random() * CH, y: y0 + Math.random() * CH, vx: rnd(-10, 10), vy: rnd(-30, -8), life: rnd(.6, 1.4), color: ["#ffd84a", "#c7eaa5", "#ffffff"][i % 3], g: 10 });
  sfxUnlock();
  toast(`Лес расширился! Открыт новый участок (${unlocked.size}). Следующий — при ${needMen()} дровосеках (и ${ZONE_COST} монетах).`, 5);
}
function sfxUnlock() {
  if (!ready()) return; const ctx = SND.ctx, t0 = ctx.currentTime, o = out(0, .7);
  [523, 659, 784, 1047, 1319].forEach((f, i) => { const t = t0 + i * .12, a = osc("triangle", f, 0, t, .8), g2 = ctx.createGain(); env(g2, t, .08, .01, .8); a.connect(g2); g2.connect(o); });
}
function drawReveals(dt) {
  for (let i = reveals.length - 1; i >= 0; i--) {
    const r = reveals[i]; r.t += dt;
    const a = Math.max(0, 1 - r.t / 1.8);
    if (a <= 0) { reveals.splice(i, 1); continue; }
    g.fillStyle = `rgba(27,42,26,${a})`; g.fillRect(r.x0, r.y0, CH, CH);
    g.strokeStyle = `rgba(255,216,74,${a})`; g.lineWidth = 1; g.strokeRect(r.x0 + .5, r.y0 + .5, CH - 1, CH - 1);
  }
}

function newTree(x, y, type) { const hp = 4 + (Math.random() * 4 | 0); return { x, y, type, state: "tree", hp, maxHp: hp, shake: 0, reserved: null, timer: 0, sways: Math.random() < .6, phase: Math.random() * 6.28 }; }

function addMan(delay = 0.8) {
  men.push({ x: DOOR.x, y: DOOR.y, state: "inside", timer: delay, target: null, carry: 0, dir: 1,
             frame: 0, ft: 0, swing: 0, hat: men.length % HATS.length, wander: null, z: 0, vz: 0, tool: 0 });
}

// ================== логика дровосеков ==================
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
function moveTo(m, tx, ty, dt) {
  const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy), step = WALK * dt;
  if (Math.abs(dx) > .5) m.dir = dx > 0 ? 1 : -1;
  m.up = dy < -Math.abs(dx) * .7;
  m.ft += dt; if (m.ft > .16) { m.ft = 0; m.frame ^= 1; }
  if (d <= step) { m.x = tx; m.y = ty; return true; }
  m.x += dx / d * step; m.y += dy / d * step; return false;
}
function nearest(list, m, ok) { let best = null, bd = 1e9; for (const o of list) { if (!ok(o)) continue; const d = dist(m.x, m.y, o.x, o.y); if (d < bd) { bd = d; best = o; } } return best; }

function updateLift(e, dt, onLand) {
  updateMood(e, dt);
  if (e.state === "held") { e.ft += dt; if (e.ft > .08) { e.ft = 0; e.frame ^= 1; } return true; }
  if (e.state === "falling") {
    e.vz -= 320 * dt; e.z += e.vz * dt;
    if (e.z <= 0) {
      e.z = 0; e.vz = 0; sfxLand(e.x);
      for (let i = 0; i < 8; i++) parts.push({ x: e.x + (Math.random() * 8 - 4), y: e.y, vx: (Math.random() - .5) * 40, vy: -8 - Math.random() * 12, life: .35 + Math.random() * .2, color: i % 2 ? "#b89a6a" : "#d8c49a", g: 60 });
      onLand(); moodLanded(e);
    }
    return true;
  }
  return false;
}

// ---------- вход в дом и выход из дома ----------
const DOOR_IN_Y = () => HOUSE.y + 24;
const inDoorway = e => e.state === "entering" || e.state === "exiting";
function startEnter(e, next) { e.state = "entering"; e.p = 0; e.next = next; e.x = DOOR.x; e.y = DOOR.y; e.up = true; e.wander = null; doorOpen = Math.max(doorOpen, .8); }
function startExit(e, next) { e.state = "exiting"; e.p = 0; e.next = next; e.x = DOOR.x; e.y = DOOR_IN_Y(); e.up = false; e.dir = 1; doorOpen = Math.max(doorOpen, .9); }
function updateDoorway(e, dt, onIn) {
  if (!inDoorway(e)) return false;
  e.p += dt / (e.state === "entering" ? .55 : .6);
  e.ft += dt; if (e.ft > .14) { e.ft = 0; e.frame ^= 1; }
  doorOpen = Math.max(doorOpen, .25);
  const k = Math.min(1, e.p);
  if (e.state === "entering") e.y = DOOR.y + (DOOR_IN_Y() - DOOR.y) * k;
  else e.y = DOOR_IN_Y() + (DOOR.y + 2 - DOOR_IN_Y()) * k;
  if (e.p >= 1) { const was = e.state; e.state = e.next; e.frame = 0; e.up = false; if (was === "entering" && onIn) onIn(); if (e.state === "asleep") onAsleep(e); }
  return true;
}
function deposit(m) {
  coins += m.carry; delivered += m.carry; sfxCoin(DOOR.x); houseVisitor(m);
  floats.push({ x: DOOR.x, y: HOUSE.y - 4 - houseUp(), text: "+" + m.carry, life: 1.4 });
  for (let i = 0; i < 6; i++) parts.push({ x: DOOR.x, y: HOUSE.y + 2 - houseUp(), vx: (Math.random() - .5) * 30, vy: -20 - Math.random() * 20, life: .7, color: i % 2 ? "#ffd84a" : "#fff2a8", g: 60 });
  m.carry = 0;
  if (m.stone > 0) {
    stone += m.stone; floats.push({ x: DOOR.x + 10, y: HOUSE.y - 10 - houseUp(), text: "+" + m.stone + " камень", life: 1.6, plain: true }); m.stone = 0;
    if (!stoneHouse && stone >= STONE_FOR_HOUSE) setTimeout(becomeStoneHouse, 400);
  }

// ================== смена времени суток ==================
// день → вечер → ночь → рассвет → день (в секундах игрового времени)
const PHASES = [
  { key: "day", name: "☀️ День", dur: 150 },
  { key: "evening", name: "🌇 Вечер", dur: 30 },
  { key: "night", name: "🌙 Ночь", dur: 75 },
  { key: "dawn", name: "🌅 Рассвет", dur: 30 },

const CYCLE = PHASES.reduce((a, p) => a + p.dur, 0);
let cycleT = 20; // начинаем утром
function phaseNow() {
  let t = ((cycleT % CYCLE) + CYCLE) % CYCLE;
  for (let i = 0; i < PHASES.length; i++) { if (t < PHASES[i].dur) return { i, ph: PHASES[i], k: t / PHASES[i].dur }; t -= PHASES[i].dur; }

}

const smooth = k => k * k * (3 - 2 * k);
// фиксация времени суток: null — время идёт само, иначе номер зафиксированной фазы
let lockedPhase = null;

}

  if (lockedPhase === null) cycleT += dt;

  let target;

  else if (ph.key === "evening") target = .5 * smooth(k);

    if (resetUnlocked) $("reset").style.visibility = "visible";
    return true;
  } catch (e) { console.warn("save load failed", e); return false; }
}
setInterval(saveGame, 8000);
addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });
addEventListener("pagehide", saveGame);

// ================== старт ==================
if (loadGame()) {
  toast("С возвращением! Ваш лес, дом и дровосеки на месте.", 4);
  doorOpen = 1;
} else {
  toast("Посреди огромного леса стоит маленький домик… (кликните по игре, чтобы включить звук)", 3.5);
  setTimeout(() => toast("Из домика выходит дровосек — пора за работу! Дрова приносят монеты, за 10 монет можно нанять ещё одного — каждый следующий дороже на 1.", 6), 3500);
  setTimeout(() => toast("Следом выходит седой старик с книгой — он сам нанимает дровосеков. Автонайм можно выключить кнопкой сверху.", 5), 9600);
  addMan(3.2);
  // старик-управляющий живёт в домике с самого начала и выходит вслед за дровосеком
  elder = { x: DOOR.x, y: DOOR.y, state: "inside", timer: 5.5, dir: 1, frame: 0, ft: 0, write: 0, spot: { x: DOOR.x + 22, y: DOOR.y + 5 }, wander: null, z: 0, vz: 0 };
  setTimeout(() => doorOpen = .9, 5300);
  setTimeout(() => doorOpen = .9, 2600);
}
document.fonts && document.fonts.ready.then(fit);
relabel();
loop();

// установка как приложение: офлайн-режим через service worker
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
